# Builds dinput8.dll from this repository on GitHub's own machine, so nobody has to trust a build
# made on the author's PC. The build is reproducible: the SHA-256 printed in the run summary matches
# the DLL on Nexus for the same version.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write      # attach the DLL to a release
  id-token: write      # signed build provenance (attestation)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the compiler (llvm-mingw 20261006) and mimalloc 3.5.3
        shell: pwsh
        run: |
          # pinned versions and checksums, so the build always uses exactly these files
          $files = @(
            @{ url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip'
               sha = '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a'; out = 'llvm.zip' },
            @{ url = 'https://github.com/microsoft/mimalloc/archive/refs/tags/v3.5.3.zip'
               sha = '97e672db18c36093378e30cc234f4625ad37b95ca9a270336752d3f3011323e9'; out = 'mimalloc.zip' }
          )
          foreach ($f in $files) {
            Invoke-WebRequest $f.url -OutFile $f.out
            $got = (Get-FileHash $f.out -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $f.sha) { throw "$($f.out): checksum $got does not match $($f.sha)" }
          }
          Expand-Archive llvm.zip "$env:RUNNER_TEMP\llvm"
          Expand-Archive mimalloc.zip "$env:RUNNER_TEMP\mi"
          Move-Item "$env:RUNNER_TEMP\mi\mimalloc-3.5.3" mimalloc
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\llvm\llvm-mingw-20261006-ucrt-x86_64\bin"

      - name: Build
        shell: cmd
        run: build.bat

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash build\dinput8.dll -Algorithm SHA256).Hash.ToLower()
          "SHA-256 of dinput8.dll: $h"
          "### dinput8.dll`nSHA-256: ``$h``" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: dinput8
          path: build/dinput8.dll

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/dinput8.dll

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build\dinput8.dll --clobber
